[package]
name = "mac-cpu-monitord"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "macOS CPU monitor daemon — HTTP/SSE backend serving CPU metrics."

[[bin]]
name = "mac-cpu-monitord"
path = "src/main.rs"

[dependencies]
mac-cpu-monitor-core = { path = "../mac-cpu-monitor-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Cross-platform fallback for usage / per-core / processes / load avg / uptime.
sysinfo = { version = "0.39", default-features = false, features = ["system", "multithread"] }

# Apple Silicon: temperature + cluster frequency via private IOReport (no sudo).
# macmon is aarch64-apple-darwin only; on Intel Macs temp/freq fall back to null.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macmon = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
